<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>My Rewards Card</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <h1>🌸 Bloom & Beyond</h1>

    <h2>My Rewards Card</h2>

    <div class="reward-card">

        <h2 id="customerName">
            Loading...
        </h2>

        <p id="customerMobile"></p>

        <div id="stampBoxes"
             class="stamp-grid">
        </div>

        <h3 id="stampText">
            🌹 0 / 10 Stamps
        </h3>

        <p class="reward-text">
            Buy 10 Bouquets and get
            1 FREE Bouquet 🎁
        </p>

    </div>

    <button
        class="secondary-button"
        onclick="window.location.href='register.html'">
        Create Another Card
    </button>

</div>

<script type="module" src="script.js"></script>

<script>
window.addEventListener("DOMContentLoaded", () => {
    loadCustomerCard();
});
</script>

</body>

</html>
